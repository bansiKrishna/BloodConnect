<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BloodConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 50%, #fecaca 100%); }
        .input-focus:focus { box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2); }
        
        /* Page transition */
        .page-transition {
            animation: pageFadeIn 0.4s ease-out;
        }
        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Button ripple effect */
        .btn-ripple {
            position: relative;
            overflow: hidden;
        }
        .btn-ripple::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .btn-ripple:active::after {
            width: 300px;
            height: 300px;
        }
        
        /* Role button animations */
        .role-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .role-btn:hover {
            transform: translateY(-2px);
        }
        .role-btn.active {
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4 page-transition">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="home.html" class="inline-flex items-center gap-3 group">
                <div class="w-14 h-14 flex items-center justify-center rounded-xl bg-gradient-to-br from-red-500 to-red-600 shadow-lg group-hover:shadow-xl transition-all duration-300 group-hover:scale-105">
                    <i class="fas fa-tint text-white text-2xl"></i>
                </div>
                <div class="text-left">
                    <h1 class="text-2xl font-bold text-gray-900">BloodConnect</h1>
                    <p class="text-sm text-gray-500">Blood Management System</p>
                </div>
            </a>
        </div>

        <!-- Login Card -->
        <div class="bg-white shadow-2xl rounded-2xl p-8 border border-gray-100">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900 mb-2">Welcome Back</h2>
                <p class="text-gray-500">Sign in to access your dashboard</p>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Login As</label>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" class="role-btn flex flex-col items-center gap-1.5 py-3 px-2 rounded-xl border-2 border-red-500 bg-red-50 text-red-700 font-semibold transition-all" data-role="donor">
                        <i class="fas fa-user text-lg"></i>
                        <span class="text-xs">Donor</span>
                    </button>
                    <button type="button" class="role-btn flex flex-col items-center gap-1.5 py-3 px-2 rounded-xl border-2 border-gray-200 text-gray-500 font-semibold transition-all hover:border-red-300 hover:text-red-600 hover:bg-red-50" data-role="admin">
                        <i class="fas fa-shield-alt text-lg"></i>
                        <span class="text-xs">Admin</span>
                    </button>
                    <button type="button" class="role-btn flex flex-col items-center gap-1.5 py-3 px-2 rounded-xl border-2 border-gray-200 text-gray-500 font-semibold transition-all hover:border-red-300 hover:text-red-600 hover:bg-red-50" data-role="hospital">
                        <i class="fas fa-hospital text-lg"></i>
                        <span class="text-xs">Hospital</span>
                    </button>
                </div>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-4 flex items-center">
                <i class="fas fa-exclamation-triangle mr-2"></i>
                <span id="errorText"></span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg input-focus focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required
                            class="w-full pl-10 pr-12 py-3 border border-gray-300 rounded-lg input-focus focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition">
                        <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="w-4 h-4 text-red-600 border-gray-300 rounded focus:ring-red-500">
                        <span class="ml-2 text-sm text-gray-600">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-red-600 hover:text-red-700 font-medium">Forgot password?</a>
                </div>

                <button type="submit" id="loginBtn" class="btn-ripple w-full py-3 bg-gradient-to-r from-red-600 to-red-700 text-white rounded-lg font-semibold hover:from-red-700 hover:to-red-800 transition-all duration-300 shadow-lg hover:shadow-xl flex items-center justify-center">
                    <span id="btnText">Sign In</span>
                    <div id="btnLoader" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin ml-2"></div>
                </button>
            </form>

            <div class="mt-6 text-center border-t border-gray-100 pt-5">
                <p class="text-gray-600 text-sm font-medium mb-3">Don't have an account? Register as:</p>
                <div class="grid grid-cols-3 gap-2">
                    <a href="register-donor.html" class="flex flex-col items-center gap-1 py-2.5 px-2 rounded-xl border-2 border-red-200 bg-red-50 text-red-700 hover:bg-red-100 hover:border-red-400 transition-all">
                        <i class="fas fa-user text-base"></i>
                        <span class="text-xs font-semibold">Donor</span>
                    </a>
                    <a href="register-facility.html" class="flex flex-col items-center gap-1 py-2.5 px-2 rounded-xl border-2 border-blue-200 bg-blue-50 text-blue-700 hover:bg-blue-100 hover:border-blue-400 transition-all">
                        <i class="fas fa-hospital text-base"></i>
                        <span class="text-xs font-semibold">Hospital</span>
                    </a>
                    <a href="register-admin.html" class="flex flex-col items-center gap-1 py-2.5 px-2 rounded-xl border-2 border-purple-200 bg-purple-50 text-purple-700 hover:bg-purple-100 hover:border-purple-400 transition-all">
                        <i class="fas fa-shield-alt text-base"></i>
                        <span class="text-xs font-semibold">Admin</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Back to Home -->
        <div class="text-center mt-6">
            <a href="home.html" class="text-gray-500 hover:text-gray-700 text-sm flex items-center justify-center gap-2">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

<script>
// Role selection
let selectedRole = 'donor';
const roleBtns = document.querySelectorAll('.role-btn');
async function loginRequest(body) { ... }

roleBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        roleBtns.forEach(b => {
            b.classList.remove('border-red-500', 'bg-red-50', 'text-red-700');
            b.classList.add('border-gray-200', 'text-gray-600');
        });
        btn.classList.remove('border-gray-200', 'text-gray-600');
        btn.classList.add('border-red-500', 'bg-red-50', 'text-red-700');
        selectedRole = btn.dataset.role;
    });
});

// Toggle password
const togglePassword = document.getElementById('togglePassword');
const passwordInput = document.getElementById('password');

togglePassword.addEventListener('click', () => {
    const type = passwordInput.type === 'password' ? 'text' : 'password';
    passwordInput.type = type;
    togglePassword.innerHTML = type === 'password'
        ? '<i class="fas fa-eye"></i>'
        : '<i class="fas fa-eye-slash"></i>';
});

// Elements
const loginForm = document.getElementById('loginForm');
const loginBtn = document.getElementById('loginBtn');
const btnText = document.getElementById('btnText');
const btnLoader = document.getElementById('btnLoader');
const errorMessage = document.getElementById('errorMessage');
const errorText = document.getElementById('errorText');

// 🔥 FIX: Proper login request with retry logic (handles Render cold start)
async function loginRequest(body) {
    const url = "https://bloodconnect-vdiz.onrender.com/api/auth/login";
    const maxRetries = 3;
    let lastError;

    for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
            console.log(`Login attempt ${attempt}/${maxRetries}...`);
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            console.log("Response status:", response.status);
            return response;

        } catch (err) {
            lastError = err;
            console.error(`Attempt ${attempt} failed:`, err.message);
            
            if (attempt < maxRetries) {
                console.log(`Retrying in 2 seconds...`);
                await new Promise(resolve => setTimeout(resolve, 2000));
            }
        }
    }

    throw lastError || new Error('Failed to connect to API after ' + maxRetries + ' attempts');
}

// Login submit
loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (!email || !password) {
        showError('Please fill in all fields');
        return;
    }

    // UI loading
    loginBtn.disabled = true;
    btnText.textContent = 'Signing in...';
    btnLoader.classList.remove('hidden');
    errorMessage.classList.add('hidden');

    try {
        const response = await loginRequest({
            role: selectedRole,
            email,
            password
        });

        let data = {};
        try {
            data = await response.json();
        } catch (e) {
            console.error("Invalid JSON response");
        }

        if (response.ok) {
            localStorage.setItem('userRole', data.role);
            localStorage.setItem('userId', data.user?.id || '');
            localStorage.setItem('userEmail', data.user?.email || '');
            localStorage.setItem('userName', data.user?.name || '');
            localStorage.setItem('userPhone', data.user?.phone || '');
            localStorage.setItem('userBloodGroup', data.user?.blood_group || '');
            localStorage.setItem('userLocation', data.user?.location || '');
            localStorage.setItem('isLoggedIn', 'true');

            if (window.BloodConnect) {
                window.BloodConnect.showToast('Login successful! Redirecting...', 'success');
            }

            setTimeout(() => {
                const redirects = {
                    donor: 'donor-dashboard.html',
                    admin: 'admin-dashboard.html',
                    hospital: 'hospital-dashboard.html',
                    lab: 'lab-dashboard.html'
                };

                if (window.BloodConnect) {
                    window.BloodConnect.navigateTo(redirects[data.role]);
                } else {
                    window.location.href = redirects[data.role];
                }
            }, 1000);

        } else {
            showError(data.error || 'Login failed');
        }

    } catch (err) {
        console.error(err);
        showError('Server is waking up... please try again in 2 seconds');
    }

    // Reset UI
    loginBtn.disabled = false;
    btnText.textContent = 'Sign In';
    btnLoader.classList.add('hidden');
});

// Error display
function showError(message) {
    errorText.textContent = message;
    errorMessage.classList.remove('hidden');

    if (window.BloodConnect) {
        window.BloodConnect.showToast(message, 'error');
    }
}
</script>
    <!-- Shared App JS -->
    <script src="js/app.js"></script>
</body>
</html>
