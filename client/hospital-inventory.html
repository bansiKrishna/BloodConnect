<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-white min-h-screen">
    <header class="bg-white border-b border-blue-100 sticky top-0 z-20">
        <div class="px-6 py-3 flex items-center justify-between">
            <h1 class="text-xl font-bold text-blue-700">Hospital Blood Inventory</h1>
            <a href="hospital-dashboard.html" class="text-blue-600 hover:underline">Back to Dashboard</a>
        </div>
    </header>
    <main class="max-w-6xl mx-auto p-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white border border-blue-100 rounded-xl p-4">
                <h2 class="font-semibold text-gray-800 mb-3">Add Inventory</h2>
                <form id="inventoryForm" class="space-y-3">
                    <select name="blood_group" required class="w-full border border-blue-200 rounded px-3 py-2">
                        <option value="">Select Blood Group</option>
                        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                        <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
                    </select>
                    <input name="units" type="number" min="1" required placeholder="Units" class="w-full border border-blue-200 rounded px-3 py-2">
                    <select name="availability_status" class="w-full border border-blue-200 rounded px-3 py-2">
                        <option value="available">Available</option>
                        <option value="limited">Limited</option>
                        <option value="critical">Critical</option>
                    </select>
                    <textarea name="notes" rows="3" placeholder="Notes" class="w-full border border-blue-200 rounded px-3 py-2"></textarea>
                    <button class="w-full py-2 bg-blue-600 text-white rounded">Save Inventory</button>
                </form>
            </div>
            <div class="lg:col-span-2 bg-white border border-blue-100 rounded-xl p-4">
                <h2 class="font-semibold text-gray-800 mb-3">Inventory List</h2>
                <div id="inventoryList" class="space-y-2"></div>
            </div>
        </div>
    </main>
    <script>
        if (!localStorage.getItem('isLoggedIn') || localStorage.getItem('userRole') !== 'hospital') {
            window.location.href = 'login.html';
        }

        async function fetchInventory() {
            const facilityId = localStorage.getItem('userId');
            const res = await fetch(`https://bloodconnect-vdiz.onrender.com/api/dashboard/inventory?facility_id=${facilityId}`);
            const data = await res.json();
            const list = document.getElementById('inventoryList');
            const rows = data.inventory || [];
            if (!rows.length) {
                list.innerHTML = '<p class="text-gray-500">No inventory records yet.</p>';
                return;
            }
            list.innerHTML = rows.map(r => `
                <div class="border border-blue-100 rounded-lg p-3 flex items-center justify-between">
                    <div>
                        <p class="font-semibold">${r.blood_group} - ${r.units} units</p>
                        <p class="text-xs text-gray-500">${r.availability_status} | ${r.notes || 'No notes'}</p>
                    </div>
                    <span class="text-xs text-gray-500">${new Date(r.created_at).toLocaleString()}</span>
                </div>
            `).join('');
        }

        document.getElementById('inventoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const payload = {
                facility_id: localStorage.getItem('userId'),
                blood_group: form.blood_group.value,
                units: Number(form.units.value),
                availability_status: form.availability_status.value,
                notes: form.notes.value
            };
            const res = await fetch('https://bloodconnect-vdiz.onrender.com/api/dashboard/inventory', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (!res.ok) {
                alert(data.message || 'Failed to save inventory');
                return;
            }
            form.reset();
            fetchInventory();
        });

        fetchInventory();
    </script>
</body>
</html>
